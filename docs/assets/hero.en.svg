<!--
  Hero do README.en.md. Versão em inglês do hero.svg; qualquer mudança de desenho entra nos dois. Renderiza no GitHub, que sanitiza SVG:
  sem elemento de script, sem HTML embutido, sem folha de estilo ou fonte
  importada — só system-ui.
  O fundo próprio (o retângulo de 1200x400) existe para o desenho ler igual no
  tema claro e no escuro; sem ele o texto some num dos dois.
  A única URL do arquivo é o namespace do W3C no atributo xmlns, que o navegador
  exige para desenhar um SVG; tirá-lo não deixa o arquivo "sem recurso externo",
  deixa a imagem em branco.
  Conferir depois de editar, com os dois comandos do CHANGELOG da 0.25.0: o
  primeiro devolve 0, o segundo só o xmlns. Este comentário não pode soletrar os
  tokens que o primeiro procura, ou ele acusa a si mesmo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">The aicf governance layer sitting above the implementation paths</title>
  <desc id="descricao">A wide band labelled Governance — PRD, roadmap, work item, closing — resting on three boxes side by side: aicf, Superpowers and Matt Pocock. Each box connects to the band by a line. Below them, the caption: interview and implementation, by any path.</desc>

  <rect x="0" y="0" width="1200" height="400" rx="24" fill="#47536b"/>

  <g stroke="#cfd8e6" stroke-width="3" stroke-linecap="round">
    <line x1="210" y1="242" x2="210" y2="158"/>
    <line x1="600" y1="242" x2="600" y2="158"/>
    <line x1="990" y1="242" x2="990" y2="158"/>
  </g>

  <rect x="60" y="48" width="1080" height="110" rx="16" fill="#eef2f8"/>
  <text x="600" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="40" font-weight="700" fill="#1f2836">Governance</text>
  <text x="600" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#5a6784">PRD · roadmap · work item · closing</text>

  <g font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="60" y="242" width="300" height="84" rx="12" fill="#5f6d89" stroke="#eef2f8" stroke-width="2.5"/>
    <text x="210" y="292">aicf</text>
    <rect x="450" y="242" width="300" height="84" rx="12" fill="#5f6d89" stroke="#7d8aa5" stroke-width="2"/>
    <text x="600" y="292">Superpowers</text>
    <rect x="840" y="242" width="300" height="84" rx="12" fill="#5f6d89" stroke="#7d8aa5" stroke-width="2"/>
    <text x="990" y="292">Matt Pocock</text>
  </g>

  <text x="600" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#c3cdde">interview and implementation, by any path</text>
</svg>
