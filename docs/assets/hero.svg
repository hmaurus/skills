<!--
  Hero do README.md e do README.en.md. Renderiza no GitHub, que sanitiza SVG:
  sem elemento de script, sem HTML embutido, sem folha de estilo ou fonte
  importada — só system-ui.
  O fundo próprio (o retângulo de 1200x400) existe para o desenho ler igual no
  tema claro e no escuro; sem ele o texto some num dos dois.
  A única URL do arquivo é o namespace do W3C no atributo xmlns, que o navegador
  exige para desenhar um SVG; tirá-lo não deixa o arquivo "sem recurso externo",
  deixa a imagem em branco.
  Conferir depois de editar, com os dois comandos do CHANGELOG da 0.25.0: o
  primeiro devolve 0, o segundo só o xmlns. Este comentário não pode soletrar os
  tokens que o primeiro procura, ou ele acusa a si mesmo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">A gestão de produto do aicf, que une o Superpowers e as skills do Matt Pocock</title>
  <desc id="descricao">No topo, uma faixa clara chamada Gestão de produto — o quê e por quê: PRD, roadmap, registro de demandas, relatório. Abaixo, ligada a ela por uma linha, a faixa do aicf: integração e condução do ciclo de vida da demanda. Dela descem linhas para três caixas: Superpowers, Matt Pocock e, menor e tracejada, o caminho aicf. Embaixo, a legenda: engenharia de software, como construir.</desc>

  <rect x="0" y="0" width="1200" height="400" rx="24" fill="#47536b"/>

  <g stroke="#cfd8e6" stroke-width="3" stroke-linecap="round">
    <line x1="600" y1="136" x2="600" y2="168"/>
    <line x1="280" y1="230" x2="280" y2="282"/>
    <line x1="680" y1="230" x2="680" y2="282"/>
    <line x1="1000" y1="230" x2="1000" y2="282"/>
  </g>

  <rect x="60" y="36" width="1080" height="100" rx="16" fill="#eef2f8"/>
  <text x="600" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#1f2836">Gestão de produto</text>
  <text x="600" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#5a6784">o quê e por quê · PRD · roadmap · registro de demandas · relatório</text>

  <rect x="60" y="168" width="1080" height="62" rx="14" fill="#2f3a50" stroke="#eef2f8" stroke-width="2.5"/>
  <text x="600" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#ffffff"><tspan font-weight="700">aicf</tspan> — integração e condução do ciclo de vida da demanda</text>

  <g font-family="system-ui, sans-serif" fill="#ffffff" text-anchor="middle">
    <rect x="100" y="282" width="360" height="70" rx="12" fill="#5f6d89" stroke="#7d8aa5" stroke-width="2"/>
    <text x="280" y="325" font-size="26" font-weight="600">Superpowers</text>
    <rect x="500" y="282" width="360" height="70" rx="12" fill="#5f6d89" stroke="#7d8aa5" stroke-width="2"/>
    <text x="680" y="325" font-size="26" font-weight="600">Matt Pocock</text>
    <rect x="900" y="282" width="200" height="70" rx="12" fill="#47536b" stroke="#7d8aa5" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="1000" y="324" font-size="20">caminho aicf</text>
  </g>

  <text x="600" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#c3cdde">engenharia de software · como construir</text>
</svg>
